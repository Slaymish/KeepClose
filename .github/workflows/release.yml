name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: keepclose-release
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      self_signed: ${{ steps.route.outputs.self_signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify explicitly self-signed releases
        id: route
        shell: bash
        run: |
          # The local packaging script uses this exact annotated-tag subject.
          # Normal release tags retain the credential-gated notarized publication path.
          subject=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$GITHUB_REF_NAME")
          kind=$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")
          if [[ "$kind" == tag && "$subject" == "Keep Close ${GITHUB_REF_NAME#v} (self-signed, not notarized)" ]]; then
            echo 'self_signed=true' >> "$GITHUB_OUTPUT"
            echo 'Signed local artifacts are published separately; all platform checks still run.'
          else
            echo 'self_signed=false' >> "$GITHUB_OUTPUT"
          fi
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [checks, route]
    if: needs.route.outputs.self_signed != 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEEPCLOSE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate credentials and release metadata
        id: release
        run: |
          for variable in CERTIFICATE_P12_BASE64 KEEPCLOSE_SIGNING_IDENTITY NOTARY_KEY_ID NOTARY_ISSUER_ID NOTARY_PRIVATE_KEY SPARKLE_PRIVATE_KEY; do
            if [ -z "${!variable}" ]; then echo "::error::Missing $variable; see docs/RELEASING.md"; exit 1; fi
          done
          python3 scripts/release.py verify "${GITHUB_REF_NAME#v}" --github-output "$GITHUB_OUTPUT"
      - name: Install project generator
        run: brew install xcodegen
      - name: Import distribution certificate
        run: |
          umask 077
          keychain="$RUNNER_TEMP/keepclose-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$NOTARY_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Verify update key continuity
        run: swift scripts/verify-update-key.swift "$RUNNER_TEMP/sparkle.key"
      - name: Build, sign and notarize universal Mac app and CLI
        run: scripts/build-release.sh '${{ steps.release.outputs.version }}' '${{ steps.release.outputs.build }}'
      - name: Sign update archive and appcast
        run: |
          curl --fail --location https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$RUNNER_TEMP/Sparkle.tar.xz"
          mkdir "$RUNNER_TEMP/Sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/Sparkle"
          signer="$RUNNER_TEMP/Sparkle/bin/sign_update"
          archive='.build-release/dist/KeepClose-macOS.zip'
          signature=$("$signer" --ed-key-file "$RUNNER_TEMP/sparkle.key" -p "$archive")
          "$signer" --ed-key-file "$RUNNER_TEMP/sparkle.key" --verify "$archive" "$signature"
          python3 scripts/generate-appcast.py --version '${{ steps.release.outputs.version }}' --build '${{ steps.release.outputs.build }}' --archive "$archive" --signature "$signature" --output .build-release/dist/appcast.xml
          "$signer" --ed-key-file "$RUNNER_TEMP/sparkle.key" .build-release/dist/appcast.xml
          "$signer" --ed-key-file "$RUNNER_TEMP/sparkle.key" --verify .build-release/dist/appcast.xml
          cd .build-release/dist
          shasum -a 256 KeepClose-macOS.zip keepclose-cli-macOS.zip appcast.xml > SHA256SUMS
      - name: Publish GitHub release
        run: |
          python3 scripts/release.py notes '${{ steps.release.outputs.version }}' > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" .build-release/dist/KeepClose-macOS.zip .build-release/dist/keepclose-cli-macOS.zip .build-release/dist/appcast.xml .build-release/dist/SHA256SUMS --verify-tag --title "Keep Close ${{ steps.release.outputs.version }}" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/keepclose-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key"
